<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F3D33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Recall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%231F3D33'/%3E%3Crect x='20' y='28' width='60' height='44' rx='4' fill='%23F6F1E3' transform='rotate(-4 50 50)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1F3D33;
    --board-dark:#16302A;
    --board-line: rgba(246,241,227,0.06);
    --card:#F6F1E3;
    --card-edge:#e8dfc4;
    --card-line:#cdc2a0;
    --ink:#2B2620;
    --ink-dim:#726a58;
    --chalk:#F2F0E8;
    --chalk-dim:#9FC0AF;
    --correct:#BFE38A;
    --correct-deep:#6FA24C;
    --wrong:#E2665A;
    --pin:#C94F4F;
    --font-display: 'Kalam', cursive;
    --font-body: 'Source Serif 4', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.05), transparent 60%),
      repeating-linear-gradient(0deg, var(--board-line) 0px, var(--board-line) 1px, transparent 1px, transparent 42px),
      linear-gradient(160deg, var(--board) 0%, var(--board-dark) 100%);
    color: var(--chalk);
    font-family: var(--font-body);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .wrap{ width:100%; max-width:520px; display:flex; flex-direction:column; flex:1; }

  /* ---------- Header ---------- */
  .app-title{
    font-family: var(--font-display);
    font-weight:700;
    font-size: 34px;
    letter-spacing: 0.5px;
    color: var(--chalk);
    text-shadow: 0 0 18px rgba(242,240,232,0.18);
    margin: 6px 0 2px 4px;
    transform: rotate(-1deg);
  }
  .app-sub{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin: 0 0 22px 6px;
  }

  /* ---------- Screens ---------- */
  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; animation: fadein .35s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Deck list ---------- */
  .deck-grid{ display:flex; flex-direction:column; gap:14px; }
  .deck-card{
    background: var(--card);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.28), inset 0 0 0 1px var(--card-edge);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    cursor:pointer;
    border:none;
    text-align:left;
    width:100%;
    font-family:inherit;
  }
  .deck-card:nth-child(3n+1){ transform: rotate(-0.6deg); }
  .deck-card:nth-child(3n+2){ transform: rotate(0.5deg); }
  .deck-card:nth-child(3n+3){ transform: rotate(-0.3deg); }
  .deck-info{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .deck-name{ font-weight:600; font-size:18px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .deck-count{ font-family: var(--font-mono); font-size:11.5px; color:var(--ink-dim); letter-spacing:0.5px; }
  .deck-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .study-btn{
    font-family: var(--font-mono); font-size:12px; font-weight:600; letter-spacing:1px;
    background: var(--board); color: var(--chalk);
    border:none; border-radius:999px; padding:9px 16px; cursor:pointer;
  }
  .icon-btn{
    background:none; border:none; color:var(--ink-dim); font-size:18px; cursor:pointer; padding:4px 6px; line-height:1;
  }
  .add-deck-card{
    background: transparent;
    border: 2px dashed rgba(242,240,232,0.28);
    border-radius: 10px;
    padding: 18px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
    color: var(--chalk-dim);
    font-family: var(--font-display);
    font-size:18px;
    width:100%;
  }
  .empty-note{
    color: var(--chalk-dim); font-size:14px; line-height:1.6; margin: 4px 4px 18px;
  }

  /* ---------- Add deck form ---------- */
  .panel{
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.3);
    color: var(--ink);
  }
  .panel h2{ font-family: var(--font-display); margin:0 0 4px; font-size:24px; }
  .panel .hint{ font-family: var(--font-mono); font-size:12px; color:var(--ink-dim); margin:0 0 18px; line-height:1.6; }
  label.field-label{ display:block; font-family: var(--font-mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-dim); margin: 14px 0 6px; }
  input[type=text]{
    width:100%; padding:11px 12px; font-family: var(--font-body); font-size:16px;
    border:1px solid var(--card-line); border-radius:8px; background:#fffdf6; color:var(--ink);
  }
  .file-drop{
    border:1.5px dashed var(--card-line); border-radius:8px; padding:18px; text-align:center;
    font-family: var(--font-mono); font-size:13px; color:var(--ink-dim); cursor:pointer;
    background:#fffdf6;
  }
  .file-drop.has-file{ color: var(--correct-deep); border-color: var(--correct-deep); }
  input[type=file]{ display:none; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-top:14px; }
  .checkbox-row input{ width:17px; height:17px; }
  .checkbox-row label{ font-size:13.5px; color: var(--ink-dim); }
  .btn-row{ display:flex; gap:10px; margin-top:22px; }
  .btn{
    font-family: var(--font-mono); font-weight:600; font-size:13px; letter-spacing:0.5px;
    border:none; border-radius:8px; padding:12px 16px; cursor:pointer; flex:1;
  }
  .btn-primary{ background: var(--board); color: var(--chalk); }
  .btn-secondary{ background: transparent; color: var(--ink-dim); border:1px solid var(--card-line); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .error-msg{ color:var(--wrong); font-family: var(--font-mono); font-size:12.5px; margin-top:10px; display:none; }

  /* ---------- Study screen ---------- */
  .study-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .back-link{ background:none; border:none; color:var(--chalk-dim); font-family: var(--font-mono); font-size:13px; cursor:pointer; padding:6px 0; }
  .progress-tag{ font-family: var(--font-mono); font-size:12px; color:var(--chalk-dim); letter-spacing:1px; }
  .progress-bar{ height:3px; background:rgba(242,240,232,0.12); border-radius:2px; margin-bottom:26px; overflow:hidden; }
  .progress-fill{ height:100%; background: var(--chalk-dim); border-radius:2px; transition: width .3s ease; }

  .card-stage{ flex:1; display:flex; align-items:flex-start; justify-content:center; }
  .index-card{
    position:relative;
    width:100%;
    background: var(--card);
    border-radius: 4px;
    padding: 34px 24px 26px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.35), inset 0 0 0 1px var(--card-edge);
    transform: rotate(-1deg);
    background-image: repeating-linear-gradient(180deg, transparent 0, transparent 37px, var(--card-line) 38px);
    background-position: 0 78px;
  }
  .index-card.shake{ animation: shake .38s ease; }
  @keyframes shake{
    10%,90%{ transform: rotate(-1deg) translateX(-1px); }
    20%,80%{ transform: rotate(-1deg) translateX(2px); }
    30%,50%,70%{ transform: rotate(-1deg) translateX(-5px); }
    40%,60%{ transform: rotate(-1deg) translateX(5px); }
  }
  .pin{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:16px; height:16px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff9d92, var(--pin) 60%);
    box-shadow: 0 3px 5px rgba(0,0,0,0.4);
  }
  .card-label{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-dim); margin-bottom:10px; }
  .card-question{ font-family: var(--font-body); font-size:21px; line-height:1.5; color:var(--ink); font-weight:600; min-height:38px; }

  .answer-row{ margin-top:22px; }
  .answer-input{
    width:100%; border:none; border-bottom:2px solid var(--card-line); background:transparent;
    font-family: var(--font-body); font-style:italic; font-size:18px; color:var(--ink);
    padding: 6px 2px 8px; outline:none;
  }
  .answer-input:focus{ border-bottom-color: var(--ink); }

  .feedback-block{ margin-top:22px; display:flex; flex-direction:column; gap:14px; }
  .fb-row{ display:flex; flex-direction:column; gap:3px; }
  .fb-label{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; }
  .fb-label.you{ color: var(--ink-dim); }
  .fb-label.correct-lbl{ color: var(--correct-deep); }
  .fb-value{ font-family: var(--font-body); font-size:18px; color: var(--ink); }
  .fb-value.wrong-val{ text-decoration: line-through; text-decoration-color: var(--wrong); text-decoration-thickness:2px; color:#8a4a44; }
  .fb-value.fuzzy-val{ color: #C99A1E; font-weight:600; }
  .fb-badge{
    display:inline-flex; align-items:center; gap:6px; font-family: var(--font-mono); font-size:12px; font-weight:600;
    letter-spacing:0.5px; padding:5px 10px; border-radius:999px; width:fit-content;
  }
  .fb-badge.ok{ background: rgba(111,162,76,0.16); color: var(--correct-deep); }
  .fb-badge.no{ background: rgba(226,102,90,0.14); color:#a4463c; }

  .action-row{ margin-top:26px; display:flex; }
  .submit-btn, .continue-btn{
    width:100%; font-family: var(--font-mono); font-weight:600; font-size:14px; letter-spacing:1px;
    text-transform:uppercase; border:none; border-radius:999px; padding:14px; cursor:pointer;
    background: var(--board); color: var(--chalk);
  }
  .continue-btn.ok{ background: var(--correct-deep); }
  .continue-btn.retry{ background: var(--wrong); }
  .submit-btn:disabled{ opacity:0.35; }

  .done-note{ text-align:center; font-family: var(--font-mono); font-size:12.5px; color:var(--chalk-dim); margin-top:16px; }

  ::selection{ background: var(--chalk); color: var(--board); }
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME SCREEN -->
  <section class="screen active" id="screen-home">
    <div class="app-title">Recall</div>
    <div class="app-sub">pick a deck to study</div>
    <div id="deck-list" class="deck-grid"></div>
  </section>

  <!-- ADD DECK SCREEN -->
  <section class="screen" id="screen-add">
    <div class="app-title" style="font-size:26px;">New deck</div>
    <div class="app-sub" style="margin-bottom:16px;">import a CSV of questions &amp; answers</div>
    <div class="panel">
      <p class="hint">Column 1 = question, column 2 = answer. One pair per row.</p>

      <label class="field-label" for="deck-name-input">Deck name</label>
      <input type="text" id="deck-name-input" placeholder="e.g. Chapter 4 — Chemistry">

      <label class="field-label">CSV file</label>
      <div class="file-drop" id="file-drop">Tap to choose a .csv file</div>
      <input type="file" id="file-input" accept=".csv,text/csv">

      <div class="checkbox-row">
        <input type="checkbox" id="header-checkbox">
        <label for="header-checkbox">First row is a header, not a card (skip it)</label>
      </div>

      <div class="error-msg" id="add-error"></div>

      <div class="btn-row">
        <button class="btn btn-secondary" id="cancel-add">Cancel</button>
        <button class="btn btn-primary" id="save-deck" disabled>Save deck</button>
      </div>
    </div>
  </section>

  <!-- STUDY SCREEN -->
  <section class="screen" id="screen-study">
    <div class="study-top">
      <button class="back-link" id="back-to-home">&larr; decks</button>
      <div class="progress-tag" id="progress-tag">0 / 0</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <div class="card-stage">
      <div class="index-card" id="index-card">
        <div class="pin"></div>
        <div class="card-label">Question</div>
        <div class="card-question" id="card-question"></div>

        <div class="answer-row" id="answer-row">
          <input type="text" class="answer-input" id="answer-input" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>

        <div class="feedback-block" id="feedback-block" style="display:none;">
          <div class="fb-badge" id="fb-badge"></div>
          <div class="fb-row">
            <div class="fb-label you">Your answer</div>
            <div class="fb-value" id="fb-user-answer"></div>
          </div>
          <div class="fb-row">
            <div class="fb-label correct-lbl">Correct answer</div>
            <div class="fb-value" id="fb-correct-answer"></div>
          </div>
        </div>

        <div class="action-row">
          <button class="submit-btn" id="submit-btn" disabled>Check</button>
        </div>
      </div>
    </div>
    <div class="done-note" id="done-note" style="display:none;"></div>
  </section>

</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "recall_decks_v1";

  // ---------- Storage ----------
  function loadDecks(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveDecks(decks){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(decks)); }
    catch(e){ console.error("Could not save decks", e); }
  }

  var decks = loadDecks(); // { id: { name, pairs: [{q,a}] } }

  // ---------- CSV parsing (handles quoted fields, commas, newlines in quotes) ----------
  function parseCSV(text){
    var rows = [], row = [], field = "", inQuotes = false;
    for (var i = 0; i < text.length; i++){
      var c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else {
        if (c === '"'){ inQuotes = true; }
        else if (c === ','){ row.push(field); field = ""; }
        else if (c === '\r'){ /* skip */ }
        else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else { field += c; }
      }
    }
    if (field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
    return rows;
  }

  function rowsToPairs(rows, skipHeader){
    var pairs = [];
    var start = skipHeader ? 1 : 0;
    for (var i = start; i < rows.length; i++){
      var r = rows[i];
      if (!r || r.length < 2) continue;
      var q = (r[0] || "").trim();
      var a = (r[1] || "").trim();
      if (!q || !a) continue;
      pairs.push({ q: q, a: a });
    }
    return pairs;
  }

  // ---------- Answer normalization ----------
  function normalize(s){
    return (s || "")
      .toLowerCase()
      .replace(/[.,!?;:'"()\-\u2018\u2019\u201c\u201d]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  // ---------- Fuzzy matching (Levenshtein edit distance) ----------
  function levenshtein(a, b){
    var m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    var prev = new Array(n + 1);
    var curr = new Array(n + 1);
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++){
      curr[0] = i;
      for (j = 1; j <= n; j++){
        var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        curr[j] = Math.min(
          prev[j] + 1,      // deletion
          curr[j - 1] + 1,  // insertion
          prev[j - 1] + cost // substitution
        );
      }
      var tmp = prev; prev = curr; curr = tmp;
    }
    return prev[n];
  }

  // ---------- Shuffle ----------
  function shuffledIndices(n){
    var arr = [];
    for (var i = 0; i < n; i++) arr.push(i);
    for (var j = arr.length - 1; j > 0; j--){
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;
    }
    return arr;
  }

  // ---------- Navigation ----------
  var screens = {
    home: document.getElementById("screen-home"),
    add: document.getElementById("screen-add"),
    study: document.getElementById("screen-study")
  };
  function showScreen(name){
    Object.keys(screens).forEach(function(k){
      screens[k].classList.toggle("active", k === name);
    });
  }

  // ---------- Home: deck list ----------
  var deckListEl = document.getElementById("deck-list");

  function renderDeckList(){
    deckListEl.innerHTML = "";
    var ids = Object.keys(decks);

    if (ids.length === 0){
      var note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = "No decks yet. Add a CSV file to start studying.";
      deckListEl.appendChild(note);
    }

    ids.forEach(function(id){
      var deck = decks[id];
      var card = document.createElement("button");
      card.className = "deck-card";
      card.innerHTML =
        '<div class="deck-info">' +
          '<div class="deck-name"></div>' +
          '<div class="deck-count"></div>' +
        '</div>' +
        '<div class="deck-actions">' +
          '<span class="study-btn">Study</span>' +
          '<button class="icon-btn" title="Delete deck" aria-label="Delete deck">&#10005;</button>' +
        '</div>';
      card.querySelector(".deck-name").textContent = deck.name;
      card.querySelector(".deck-count").textContent = deck.pairs.length + (deck.pairs.length === 1 ? " card" : " cards");

      card.addEventListener("click", function(e){
        if (e.target.closest(".icon-btn")) return;
        startDeck(id);
      });
      card.querySelector(".icon-btn").addEventListener("click", function(e){
        e.stopPropagation();
        if (confirm('Delete "' + deck.name + '"? This can\'t be undone.')){
          delete decks[id];
          saveDecks(decks);
          renderDeckList();
        }
      });

      deckListEl.appendChild(card);
    });

    var addCard = document.createElement("button");
    addCard.className = "add-deck-card";
    addCard.innerHTML = "&#43; Add deck";
    addCard.addEventListener("click", openAddScreen);
    deckListEl.appendChild(addCard);
  }

  // ---------- Add deck screen ----------
  var nameInput = document.getElementById("deck-name-input");
  var fileInput = document.getElementById("file-input");
  var fileDrop = document.getElementById("file-drop");
  var headerCheckbox = document.getElementById("header-checkbox");
  var saveBtn = document.getElementById("save-deck");
  var addError = document.getElementById("add-error");

  var pendingRows = null;
  var pendingFileName = "";

  function openAddScreen(){
    nameInput.value = "";
    fileInput.value = "";
    headerCheckbox.checked = false;
    fileDrop.textContent = "Tap to choose a .csv file";
    fileDrop.classList.remove("has-file");
    addError.style.display = "none";
    saveBtn.disabled = true;
    pendingRows = null;
    pendingFileName = "";
    showScreen("add");
  }

  fileDrop.addEventListener("click", function(){ fileInput.click(); });

  fileInput.addEventListener("change", function(){
    var file = fileInput.files[0];
    if (!file) return;
    pendingFileName = file.name.replace(/\.csv$/i, "");
    var reader = new FileReader();
    reader.onload = function(e){
      pendingRows = parseCSV(String(e.target.result));
      fileDrop.textContent = "Selected: " + file.name;
      fileDrop.classList.add("has-file");
      if (!nameInput.value.trim()) nameInput.value = pendingFileName;
      validateAddForm();
    };
    reader.onerror = function(){
      addError.textContent = "Couldn't read that file. Try again.";
      addError.style.display = "block";
    };
    reader.readAsText(file);
  });

  function validateAddForm(){
    saveBtn.disabled = !(pendingRows && nameInput.value.trim().length > 0);
  }
  nameInput.addEventListener("input", validateAddForm);
  headerCheckbox.addEventListener("change", function(){
    /* no-op, just re-check on save */
  });

  document.getElementById("cancel-add").addEventListener("click", function(){
    showScreen("home");
  });

  document.getElementById("save-deck").addEventListener("click", function(){
    addError.style.display = "none";
    if (!pendingRows){ return; }
    var pairs = rowsToPairs(pendingRows, headerCheckbox.checked);
    if (pairs.length === 0){
      addError.textContent = "No valid question/answer rows found in that file. Make sure column 1 is the question and column 2 is the answer.";
      addError.style.display = "block";
      return;
    }
    var name = nameInput.value.trim() || pendingFileName || "Untitled deck";
    var id = "deck_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    decks[id] = { name: name, pairs: pairs };
    saveDecks(decks);
    renderDeckList();
    showScreen("home");
  });

  // ---------- Study screen ----------
  var progressTag = document.getElementById("progress-tag");
  var progressFill = document.getElementById("progress-fill");
  var cardQuestion = document.getElementById("card-question");
  var answerRow = document.getElementById("answer-row");
  var answerInput = document.getElementById("answer-input");
  var submitBtn = document.getElementById("submit-btn");
  var feedbackBlock = document.getElementById("feedback-block");
  var fbBadge = document.getElementById("fb-badge");
  var fbUserAnswer = document.getElementById("fb-user-answer");
  var fbCorrectAnswer = document.getElementById("fb-correct-answer");
  var indexCard = document.getElementById("index-card");
  var doneNote = document.getElementById("done-note");

  var study = {
    deckId: null,
    pairs: [],
    queue: [],
    currentIndex: null,
    completedThisPass: 0,
    phase: "ask" // ask | wrong | correct
  };

  function startDeck(id){
    var deck = decks[id];
    if (!deck) return;
    study.deckId = id;
    study.pairs = deck.pairs;
    study.queue = shuffledIndices(study.pairs.length);
    study.completedThisPass = 0;
    pickNext();
    showScreen("study");
  }

  function pickNext(){
    if (study.queue.length === 0){
      study.queue = shuffledIndices(study.pairs.length);
      study.completedThisPass = 0;
    }
    study.currentIndex = study.queue.pop();
    study.phase = "ask";
    renderCard();
  }

  function renderCard(){
    var pair = study.pairs[study.currentIndex];
    cardQuestion.textContent = pair.q;
    answerInput.value = "";
    feedbackBlock.style.display = "none";
    answerRow.style.display = "block";
    submitBtn.style.display = "block";
    submitBtn.textContent = "Check";
    submitBtn.className = "submit-btn";
    submitBtn.disabled = true;

    var total = study.pairs.length;
    var done = study.completedThisPass;
    progressTag.textContent = (done + 1) + " / " + total;
    progressFill.style.width = Math.round((done / total) * 100) + "%";
    doneNote.style.display = "none";

    setTimeout(function(){ answerInput.focus(); }, 50);
  }

  answerInput.addEventListener("input", function(){
    submitBtn.disabled = answerInput.value.trim().length === 0;
  });
  answerInput.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !submitBtn.disabled && study.phase === "ask"){
      checkAnswer();
    }
  });

  submitBtn.addEventListener("click", function(){
    if (study.phase === "ask"){
      checkAnswer();
    } else if (study.phase === "wrong"){
      study.phase = "ask";
      renderCard();
    } else if (study.phase === "correct"){
      study.completedThisPass++;
      pickNext();
    }
  });

  function checkAnswer(){
    var pair = study.pairs[study.currentIndex];
    var userRaw = answerInput.value;
    var userNorm = normalize(userRaw);
    var correctNorm = normalize(pair.a);

    var exact = userNorm === correctNorm;
    var fuzzyOk = false;
    if (!exact && correctNorm.length > 30){
      fuzzyOk = levenshtein(userNorm, correctNorm) < 5;
    }
    var isCorrect = exact || fuzzyOk;

    answerRow.style.display = "none";
    feedbackBlock.style.display = "flex";
    fbUserAnswer.textContent = userRaw.trim();
    fbUserAnswer.className = "fb-value" + (isCorrect ? "" : " wrong-val");
    fbCorrectAnswer.textContent = pair.a;
    fbCorrectAnswer.className = "fb-value" + (fuzzyOk ? " fuzzy-val" : "");

    if (isCorrect){
      study.phase = "correct";
      fbBadge.className = "fb-badge ok";
      fbBadge.textContent = "\u2713 Correct";
      submitBtn.textContent = "Next card";
      submitBtn.className = "submit-btn continue-btn ok";
      submitBtn.disabled = false;
    } else {
      study.phase = "wrong";
      fbBadge.className = "fb-badge no";
      fbBadge.textContent = "\u2717 Not quite — try again";
      submitBtn.textContent = "Continue";
      submitBtn.className = "submit-btn continue-btn retry";
      submitBtn.disabled = false;
      indexCard.classList.remove("shake");
      void indexCard.offsetWidth;
      indexCard.classList.add("shake");
    }
  }

  document.getElementById("back-to-home").addEventListener("click", function(){
    showScreen("home");
  });

  // ---------- Init ----------
  renderDeckList();
})();
</script>
</body>
</html>
